<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WokUp Menu</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>
<body>

  <header class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
      <img src="assets/logo.png" class="logo">

      <h1>WokUp</h1>
      <p>Premium Chinese Cuisine</p>

      <a href="#menu" class="menu-btn">
        View Menu
      </a>
    </div>
  </header>

  <section class="menu-section" id="menu">

    <h2>Popular Items</h2>

    <div class="menu-grid">

      <!-- CARD 1 -->
      <div class="menu-card">
        <div class="image-container">
          <img src="assets/chowmein.jpg">
        </div>

        <div class="card-content">
          <h3>Chicken Chow Mein</h3>

          <p>
            Stir-fried noodles with chicken and vegetables.
          </p>

          <div class="price-row">
            <span class="price">Rs. 890</span>

            <a
              class="order-btn"
              href="https://wa.me/923001234567?text=I%20want%20Chicken%20Chow%20Mein"
              target="_blank"
            >
              <i class="fab fa-whatsapp"></i>
              Order
            </a>
          </div>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="menu-card">
        <div class="image-container">
          <img src="assets/wings.jpg">
        </div>

        <div class="card-content">
          <h3>Dynamite Wings</h3>

          <p>
            Crispy wings tossed in spicy dynamite sauce.
          </p>

          <div class="price-row">
            <span class="price">Rs. 1190</span>

            <a
              class="order-btn"
              href="https://wa.me/923001234567?text=I%20want%20Dynamite%20Wings"
              target="_blank"
            >
              <i class="fab fa-whatsapp"></i>
              Order
            </a>
          </div>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="menu-card">
        <div class="image-container">
          <img src="assets/momos.jpg">
        </div>

        <div class="card-content">
          <h3>Chicken Momos</h3>

          <p>
            Soft steamed dumplings with spicy dip.
          </p>

          <div class="price-row">
            <span class="price">Rs. 750</span>

            <a
              class="order-btn"
              href="https://wa.me/923001234567?text=I%20want%20Chicken%20Momos"
              target="_blank"
            >
              <i class="fab fa-whatsapp"></i>
              Order
            </a>
          </div>
        </div>
      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
